spring.application.name=hospital-appointment

# ---- MySQL (change username/password or set DB_URL / DB_USERNAME / DB_PASSWORD env vars) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically. Fine for learning; use Flyway/Liquibase in real projects.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Services turn entities into DTOs inside their transactions, so lazy loading outside a transaction is not needed.
spring.jpa.open-in-view=false

# ---- JWT ----
# Base64 secret (must decode to at least 32 bytes). Replace it before deploying anywhere public.
jwt.secret=${JWT_SECRET:SG9zcGl0YWxBcHBvaW50bWVudFN5c3RlbVNlY3JldEtleUZvckp3dFNpZ25pbmcyMDI2}
jwt.expiration-ms=86400000

# ---- Email notifications ----
# While app.mail.enabled=false the emails are only printed in the console log.
# To really send them: set MAIL_ENABLED=true and uncomment the spring.mail.* lines below (Gmail needs an "app password").
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@hospital.com}
