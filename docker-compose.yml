# Starts MySQL + the app together:  docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hospital_db
    ports:
      - "3307:3306"        # 3307 on your PC, so it does not clash with a MySQL you already run
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/hospital_db?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      JWT_SECRET: SG9zcGl0YWxBcHBvaW50bWVudFN5c3RlbVNlY3JldEtleUZvckp3dFNpZ25pbmcyMDI2   # change for real deployments
